- date: 28 April 2025
  headline: Our paper on <a href="https://doi.org/10.1017/jfm.2025.240"> polymeric stress prediction in a viscoelastic turbulent channel flow </a > is published in JFM. Congratulations Ari!
  
- date: 22 April 2025
  headline: Dr Vidar Stiernström joined our group as a postdoc! Vidar will be modeling ice as a non-Newtonian fluid using finite element methods. Welcome Vidar!

- date: 25 March 2025
