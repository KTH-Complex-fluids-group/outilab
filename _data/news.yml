- date: 25 December 2024
  headline: Our paper on <a href="https://doi.org/10.1017/jfm.2024.1073"> bubble bursting in elastoviscoplastic media </a > is out (journal cover!). Congratulations Ari!

- date: 04 December 2024
  headline: Our group has been <a href="https://www.flow.kth.se/news/prof-outi-tammisola-has-received-an-erc-consolidator-grant-1.1374469"> awarded an ERC Consolidator Grant</a >! Recruitment opportunities to be announced soon - stay tuned!
